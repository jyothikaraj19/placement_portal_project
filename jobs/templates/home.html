<!DOCTYPE html>
<html>
<head>
  <title>Placement Portal</title>
  <style>
    body { font-family: Arial; background: #f0f2f5; margin:0; padding:20px; }
    h1 { text-align:center; color: #2c3e50; }
    .job-card {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin: 20px auto;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border-left: 6px solid #3498db;
    }
    .job-card h2 { color: #2980b9; margin:0; }
    .company { color: #e67e22; font-weight:bold; }
    .btn {
      background: #3498db; color: white; padding: 10px 20px;
      border: none; border-radius: 8px; cursor: pointer; margin-top:10px;
    }
    .btn:hover { background: #2980b9; }
  </style>
</head>
<body>
  <h1>🎓 Placement Portal - Jobs 🚀</h1>
  {% for job in jobs %}
  <div class="job-card">
    <h2>{{ job.title }}</h2>
    <p class="company">{{ job.company }} | {{ job.location }}</p>
    <p>{{ job.description }}</p>
    <a href="/apply/{{ job.id }}/" class="btn" style="display:inline-block; text-decoration:none; text-align:center;">Apply Now</a>
  </div>
  {% endfor %}
</body>
</html>
